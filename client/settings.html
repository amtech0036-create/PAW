<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Manage your account, financial settings, categories, and data." />
  <title>Settings · Personal Cash Flow Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-bar">
      <h1>Settings</h1>
      <a class="bar-action" href="dashboard.html" aria-label="Back to dashboard">‹</a>
    </header>

    <!-- Account (wired in Phase 8/12). -->
    <section class="card" aria-label="Account">
      <h2 class="section-title">Account</h2>
      <div class="settings-list">
        <button type="button" class="settings-row">
          <span>Name</span>
          <span class="row-value" id="account-name">—</span>
        </button>
        <button type="button" class="settings-row">
          <span>Email</span>
          <span class="row-value" id="account-email">—</span>
        </button>
        <button type="button" class="settings-row">
          <span>Change Password</span>
          <span class="row-value">›</span>
        </button>
      </div>
    </section>

    <!-- Financial (wired in a later phase). -->
    <section class="card" aria-label="Financial">
      <h2 class="section-title">Financial</h2>
      <div class="settings-list">
        <button type="button" class="settings-row">
          <span>Currency</span>
          <span class="row-value">৳ BDT</span>
        </button>
        <button type="button" class="settings-row">
          <span>Opening Balance</span>
          <span class="row-value">—</span>
        </button>
        <button type="button" class="settings-row">
          <span>Opening Balance Date</span>
          <span class="row-value">—</span>
        </button>
      </div>
    </section>

    <!-- Categories (wired in Phase 12). -->
    <section class="card" aria-label="Categories">
      <h2 class="section-title">Categories</h2>
      <div class="settings-list">
        <button type="button" class="settings-row">
          <span>Income Categories</span>
          <span class="row-value">›</span>
        </button>
        <button type="button" class="settings-row">
          <span>Expense Categories</span>
          <span class="row-value">›</span>
        </button>
      </div>
    </section>

    <!-- App preferences. -->
    <section class="card" aria-label="App">
      <h2 class="section-title">App</h2>
      <div class="settings-list">
        <button type="button" class="settings-row">
          <span>Theme</span>
          <span class="row-value">System</span>
        </button>
        <button type="button" class="settings-row">
          <span>Language</span>
          <span class="row-value">English</span>
        </button>
        <button type="button" class="settings-row">
          <span>Date Format</span>
          <span class="row-value">DD MMM YYYY</span>
        </button>
      </div>
    </section>

    <!-- Data (wired in Phase 15). -->
    <section class="card" aria-label="Data">
      <h2 class="section-title">Data</h2>
      <div class="btn-stack">
        <button type="button" class="btn btn-secondary">Export CSV</button>
        <button type="button" class="btn btn-secondary">Export JSON</button>
        <button type="button" class="btn btn-secondary">Import JSON</button>
      </div>
    </section>

    <!-- Security. -->
    <section class="card" aria-label="Security">
      <h2 class="section-title">Security</h2>
      <div class="btn-stack">
        <button type="button" class="btn btn-danger">Log Out</button>
      </div>
      <p class="stat-note">Log out and session checks are wired in Phase 8.</p>
    </section>

    <footer class="footer">
      <p>Phase 7 skeleton &middot; actions wired in later phases</p>
    </footer>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="dashboard.html">
      <span class="nav-icon" aria-hidden="true">⌂</span>
      Home
    </a>
    <a class="nav-item" href="transactions.html">
      <span class="nav-icon" aria-hidden="true">≣</span>
      Transactions
    </a>
    <span class="nav-add">
      <button type="button" aria-label="Add transaction (opens modal in Phase 10)">＋</button>
    </span>
    <a class="nav-item" href="reports.html">
      <span class="nav-icon" aria-hidden="true">▤</span>
      Reports
    </a>
    <a class="nav-item" href="settings.html" aria-current="page">
      <span class="nav-icon" aria-hidden="true">⚙</span>
      Settings
    </a>
  </nav>
</body>
</html>
