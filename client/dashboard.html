<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Your cash flow dashboard: balance, income, expenses, and recent transactions." />
  <title>Dashboard · Personal Cash Flow Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CashFlow" />
  <script src="js/pwa.js" defer></script>
</head>
<body data-auth="required">
  <main class="app-shell">
    <header class="app-bar">
      <h1>Dashboard<span class="bar-subtitle" id="greeting"></span></h1>
      <a class="bar-action" href="settings.html" aria-label="Open settings">⚙</a>
    </header>

    <section class="card balance-card" aria-label="Current balance">
      <p class="stat-label">Current Balance</p>
      <p class="stat-value" id="current-balance">—</p>
      <p class="stat-note">Opening balance + income − expenses</p>
    </section>

    <section class="stat-grid" aria-label="Financial summary">
      <div class="card">
        <p class="stat-label">Income</p>
        <p class="stat-value income" id="total-income">—</p>
      </div>
      <div class="card">
        <p class="stat-label">Expenses</p>
        <p class="stat-value expense" id="total-expense">—</p>
      </div>
      <div class="card">
        <p class="stat-label">Net Cash Flow</p>
        <p class="stat-value" id="net-cash-flow">—</p>
      </div>
      <div class="card">
        <p class="stat-label">This Month</p>
        <p class="stat-value" id="month-label">—</p>
      </div>
    </section>

    <section aria-label="Recent transactions">
      <h2 class="section-title">Recent Transactions</h2>
      <div id="recent-transactions" class="tx-list" hidden></div>
      <div id="recent-empty" class="empty-state">
        <p>No transactions yet.</p>
        <div class="btn-stack">
          <button type="button" class="btn btn-primary" data-action="add" data-tx-type="income">+ Add Income</button>
          <button type="button" class="btn btn-secondary" data-action="add" data-tx-type="expense">− Add Expense</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>Personal Cash Flow Tracker</p>
    </footer>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="dashboard.html" aria-current="page">
      <span class="nav-icon" aria-hidden="true">⌂</span>
      Home
    </a>
    <a class="nav-item" href="transactions.html">
      <span class="nav-icon" aria-hidden="true">≣</span>
      Transactions
    </a>
    <span class="nav-add">
      <button type="button" data-action="add" aria-label="Add transaction">＋</button>
    </span>
    <a class="nav-item" href="reports.html">
      <span class="nav-icon" aria-hidden="true">▤</span>
      Reports
    </a>
    <a class="nav-item" href="settings.html">
      <span class="nav-icon" aria-hidden="true">⚙</span>
      Settings
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/format.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/transactionModal.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
