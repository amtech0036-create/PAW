<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Personal Cash Flow Tracker - know exactly how much came in, how much went out, and how much remains." />
  <title>Personal Cash Flow Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="card hero">
      <div class="app-icon" aria-hidden="true">৳</div>
      <h1>Cash Flow Tracker</h1>
      <p class="tagline">
        A very fast personal money ledger that tells you where your money came
        from, where it went, and how much you have now.
      </p>
    </section>

    <section class="card status-card" aria-live="polite">
      <h2>Server Status</h2>
      <div class="status-row">
        <span class="status-label">API</span>
        <span id="api-status" class="status-value">Checking&hellip;</span>
      </div>
      <div class="status-row">
        <span class="status-label">Database</span>
        <span id="db-status" class="status-value">Checking&hellip;</span>
      </div>
      <p id="status-note" class="status-note"></p>
    </section>

    <footer class="footer">
      <p>Phase 1 &middot; Project setup &middot; v0.1.0</p>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
