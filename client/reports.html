<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Monthly reports: income vs expense, expense categories, and monthly history." />
  <title>Reports · Personal Cash Flow Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CashFlow" />
  <script src="js/pwa.js" defer></script>
</head>
<body data-auth="required">
  <main class="app-shell">
    <header class="app-bar">
      <h1>Reports</h1>
      <a class="bar-action" href="dashboard.html" aria-label="Back to dashboard">‹</a>
    </header>

    <section class="card filter-bar" aria-label="Report period">
      <div class="form-group" style="margin-bottom: 0">
        <label for="report-month">Month</label>
        <input type="month" id="report-month" name="month" />
      </div>
      <div class="chip-row" role="group" aria-label="Period mode">
        <button type="button" class="chip" id="mode-month" aria-pressed="true">Monthly</button>
        <button type="button" class="chip" id="mode-custom" aria-pressed="false">Custom range</button>
      </div>
      <div id="report-custom-range" class="filter-bar" hidden>
        <div class="form-group" style="margin-bottom: 0">
          <label for="report-start-date">From</label>
          <input type="date" id="report-start-date" name="startDate" />
        </div>
        <div class="form-group" style="margin-bottom: 0">
          <label for="report-end-date">To</label>
          <input type="date" id="report-end-date" name="endDate" />
        </div>
        <button type="button" class="btn btn-primary" id="report-apply-custom">Apply Range</button>
      </div>
    </section>

    <section class="card" aria-label="Period summary">
      <h2 class="section-title" id="report-period-title">—</h2>
      <p class="stat-label">Income</p>
      <p class="stat-value income" id="report-income">—</p>
      <p class="stat-label" style="margin-top: 12px">Expenses</p>
      <p class="stat-value expense" id="report-expense">—</p>
      <p class="stat-label" style="margin-top: 12px">Net</p>
      <p class="stat-value" id="report-net">—</p>
      <p class="stat-note" id="report-count"></p>
    </section>

    <section class="card" aria-label="Income vs expense">
      <h2 class="section-title">Income vs Expense</h2>
      <div class="bar-row">
        <span class="bar-label">Income</span>
        <div class="bar-track">
          <div class="bar-fill income" id="bar-income" style="width: 0%"></div>
        </div>
      </div>
      <div class="bar-row">
        <span class="bar-label">Expense</span>
        <div class="bar-track">
          <div class="bar-fill expense" id="bar-expense" style="width: 0%"></div>
        </div>
      </div>
      <p class="stat-note" id="report-bar-note"></p>
    </section>

    <section class="card" aria-label="Expense categories">
      <h2 class="section-title">Expense Categories</h2>
      <div id="report-categories"></div>
      <div id="report-categories-empty" class="empty-state" hidden>
        <p>No financial activity for this period.</p>
      </div>
    </section>

    <section class="card" aria-label="Monthly history">
      <h2 class="section-title">Monthly History</h2>
      <div id="report-history"></div>
    </section>

    <footer class="footer">
      <p>Numbers are calculated by the backend (PRD section 18)</p>
    </footer>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="dashboard.html">
      <span class="nav-icon" aria-hidden="true">⌂</span>
      Home
    </a>
    <a class="nav-item" href="transactions.html">
      <span class="nav-icon" aria-hidden="true">≣</span>
      Transactions
    </a>
    <span class="nav-add">
      <button type="button" data-action="add" aria-label="Add transaction">＋</button>
    </span>
    <a class="nav-item" href="reports.html" aria-current="page">
      <span class="nav-icon" aria-hidden="true">▤</span>
      Reports
    </a>
    <a class="nav-item" href="settings.html">
      <span class="nav-icon" aria-hidden="true">⚙</span>
      Settings
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/format.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/transactionModal.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
