<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Search, filter, and review all of your transactions." />
  <title>Transactions · Personal Cash Flow Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-auth="required">
  <main class="app-shell">
    <header class="app-bar">
      <h1>Transactions</h1>
      <a class="bar-action" href="dashboard.html" aria-label="Back to dashboard">‹</a>
    </header>

    <section class="card filter-bar" aria-label="Search and filters">
      <div class="form-group" style="margin-bottom: 0">
        <label for="tx-search">Search</label>
        <input type="search" id="tx-search" name="search" placeholder="Search notes or categories" />
      </div>

      <div class="chip-row" role="group" aria-label="Filter by type">
        <button type="button" class="chip" data-type="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-type="income" aria-pressed="false">Income</button>
        <button type="button" class="chip" data-type="expense" aria-pressed="false">Expense</button>
      </div>

      <div class="form-group" style="margin-bottom: 0">
        <label for="tx-date-range">Date range</label>
        <select id="tx-date-range" name="dateRange">
          <option value="all" selected>All time</option>
          <option value="today">Today</option>
          <option value="this-week">This Week</option>
          <option value="this-month">This Month</option>
          <option value="last-month">Last Month</option>
          <option value="custom">Custom Range…</option>
        </select>
      </div>

      <div id="tx-custom-range" class="filter-bar" hidden>
        <div class="form-group" style="margin-bottom: 0">
          <label for="tx-start-date">From</label>
          <input type="date" id="tx-start-date" name="startDate" />
        </div>
        <div class="form-group" style="margin-bottom: 0">
          <label for="tx-end-date">To</label>
          <input type="date" id="tx-end-date" name="endDate" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 0">
        <label for="tx-category">Category</label>
        <select id="tx-category" name="category">
          <option value="all" selected>All categories</option>
        </select>
      </div>
    </section>

    <section aria-label="Transaction list">
      <h2 class="section-title">
        All Transactions <span class="row-value" id="tx-count"></span>
      </h2>
      <div id="tx-error" class="form-error" role="alert"></div>
      <div id="tx-loading" class="empty-state">Loading…</div>
      <div id="tx-list" class="tx-list" hidden></div>
      <div id="tx-empty" class="empty-state" hidden>
        <p>No transactions match.</p>
        <p class="stat-note">Try changing the filters, or add one with the ＋ button below.</p>
      </div>
      <div class="btn-stack" id="tx-load-more-wrap" hidden style="margin-top: 12px">
        <button type="button" class="btn btn-secondary" id="tx-load-more">Load more</button>
      </div>
    </section>

    <footer class="footer">
      <p>Tap a transaction to edit or delete it</p>
    </footer>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="dashboard.html">
      <span class="nav-icon" aria-hidden="true">⌂</span>
      Home
    </a>
    <a class="nav-item" href="transactions.html" aria-current="page">
      <span class="nav-icon" aria-hidden="true">≣</span>
      Transactions
    </a>
    <span class="nav-add">
      <button type="button" data-action="add" aria-label="Add transaction">＋</button>
    </span>
    <a class="nav-item" href="reports.html">
      <span class="nav-icon" aria-hidden="true">▤</span>
      Reports
    </a>
    <a class="nav-item" href="settings.html">
      <span class="nav-icon" aria-hidden="true">⚙</span>
      Settings
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/format.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/transactionModal.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
