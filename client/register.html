<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Create your Personal Cash Flow Tracker account." />
  <title>Sign Up · Personal Cash Flow Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell no-nav">
    <section class="card hero">
      <div class="app-icon" aria-hidden="true">৳</div>
      <h1>Create account</h1>
      <p class="tagline">Start tracking your money in minutes.</p>
    </section>

    <section class="card">
      <!-- Wired up in Phase 8 (Authentication UI). -->
      <form id="register-form" action="#" method="post" novalidate>
        <p id="register-error" class="form-error" role="alert"></p>

        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            placeholder="Your name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            minlength="8"
            required
          />
          <span class="hint">Use at least 8 characters.</span>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            placeholder="Repeat your password"
            minlength="8"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Sign Up</button>
      </form>

      <p class="form-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </section>

    <footer class="footer">
      <p><a href="index.html">Back to home</a></p>
    </footer>
  </main>
</body>
</html>
