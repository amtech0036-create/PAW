<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Log in to your Personal Cash Flow Tracker account." />
  <title>Log In · Personal Cash Flow Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell no-nav">
    <section class="card hero">
      <div class="app-icon" aria-hidden="true">৳</div>
      <h1>Welcome back</h1>
      <p class="tagline">Log in to see your cash flow.</p>
    </section>

    <section class="card">
      <!-- Wired up in Phase 8 (Authentication UI). -->
      <form id="login-form" action="#" method="post" novalidate>
        <p id="login-error" class="form-error" role="alert"></p>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Your password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Log In</button>
      </form>

      <p class="form-footer">
        New here? <a href="register.html">Create an account</a>
      </p>
    </section>

    <footer class="footer">
      <p><a href="index.html">Back to home</a></p>
    </footer>
  </main>
</body>
</html>
