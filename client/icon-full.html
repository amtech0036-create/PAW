<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; }
  /* Full-bleed icon: gradient square, large glyph. */
  .icon {
    width: 100vw;
    height: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0a84ff, #0055d4);
    color: #ffffff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 700;
  }
  .glyph { font-size: 58vw; line-height: 1; transform: translateY(-2vw); }
</style>
</head>
<body>
  <div class="icon"><span class="glyph">&#2547;</span></div>
</body>
</html>
